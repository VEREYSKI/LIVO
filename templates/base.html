<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LIVO{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
  <a class="logo" href="{{ url_for('index') }}">LIVO</a>
  <nav>
    <a href="{{ url_for('movies') }}">🎬 Фильмы</a>
    <a href="{{ url_for('games') }}">🎮 Игры</a>
    <a href="{{ url_for('fitness') }}">🏋️ Фитнес</a>
    <a href="{{ url_for('challenges') }}">🔥 Челленджи</a>
    <a href="{{ url_for('pc_builder') }}">🖥️ ПК</a>
    <a href="{{ url_for('recipes') }}">🍳 Рецепты</a>
  </nav>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer>
  <a href="{{ url_for('about') }}">📖 О сайте</a>
  <a href="{{ url_for('privacy') }}">🔒 Конфиденциальность</a>
  <a href="{{ url_for('policy') }}">📜 Политика</a>
  <a href="{{ url_for('social') }}">📱 Социальные сети</a>
</footer>
</body>
</html>
