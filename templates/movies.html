{% extends "base.html" %}
{% block title %}Фильмы — LIVO{% endblock %}
{% block content %}
<h1>🎬 Фильмы</h1>
<p>Каталог фильмов LIVO за <strong>2000–2026</strong>. Ищи по названию, жанру или году — результаты обновляются мгновенно.</p>
<form class="search" id="searchForm" role="search">
  <input id="q" type="search" value="{{ q }}" autocomplete="off" placeholder="🔍 Например: Batman, фантастика, 2019..." aria-label="Поиск фильмов">
  <button type="submit" aria-label="Искать">⌕</button>
</form>
<div class="section-title"><h2 id="count">{{ total }} фильмов</h2><span class="note">2000–2026</span></div>
<div data-catalog="movie" class="grid poster-grid" id="grid" aria-live="polite"></div>
<noscript><p class="note">Для каталога нужен включённый JavaScript.</p></noscript>
{% endblock %}
