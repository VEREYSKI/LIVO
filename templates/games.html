{% extends "base.html" %}
{% block title %}Игры — LIVO{% endblock %}
{% block content %}
<h1>🎮 Игры</h1>
<p>Игры разных жанров с 2000 года по настоящее время.</p>
<form class="search" id="searchForm" role="search">
  <input id="q" type="search" value="{{ q }}" autocomplete="off" placeholder="🔍 Найти игру, жанр или платформу..." aria-label="Поиск игр">
  <button type="submit" aria-label="Искать">⌕</button>
</form>
<div class="chips"><button type="button" class="chip active" data-genre="all">Все жанры</button><button type="button" class="chip" data-genre="Action">Экшен</button><button type="button" class="chip" data-genre="RPG">RPG</button><button type="button" class="chip" data-genre="Shooter">Шутеры</button><button type="button" class="chip" data-genre="Horror">Хорроры</button><button type="button" class="chip" data-genre="Racing">Гонки</button><button type="button" class="chip" data-genre="Strategy">Стратегии</button><button type="button" class="chip" data-genre="Sports">Спорт</button><button type="button" class="chip" data-genre="Simulation">Симуляторы</button><button type="button" class="chip" data-genre="Survival">Выживание</button><button type="button" class="chip" data-genre="Co-op">Кооператив</button></div>
<div class="section-title"><h2 id="count">{{ total }} игр</h2></div>
<div data-catalog="game" class="grid poster-grid" id="grid" aria-live="polite"></div>
{% endblock %}
