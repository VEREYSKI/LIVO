{% extends "base.html" %}
{% block title %}{{ movie.title }} — LIVO{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('movies') }}">← Все фильмы</a>
<section class="movie-hero movie-detail-only">
  <div class="poster-ph poster-detail" data-poster-title="{{ movie.title|e }}" data-poster-year="{{ movie.year }}" data-poster-kind="movie" style="--h:{{ movie.title|hue }}">
    <span class="poster-loading">Загрузка постера…</span>
    <span class="ph-emoji" aria-hidden="true">🎬</span>
    <span class="ph-year">{{ movie.year }}</span>
  </div>
  <div class="movie-info">
    <h1>{{ movie.title }}</h1>
    <div class="tags">
      <span class="tag">📅 {{ movie.year }}</span>
      {% for g in movie.genre.split('/') %}<span class="tag">{{ g.strip() }}</span>{% endfor %}
    </div>
  </div>
</section>
{% endblock %}
