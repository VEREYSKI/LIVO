{% extends "base.html" %}
{% block title %}Подтверждение email — LIVO{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="badge">LIVO • ПОДТВЕРЖДЕНИЕ</div>
    <h1>Подтвердите email</h1>
    <p class="muted">Мы отправили 6-значный код на <strong>{{ email }}</strong>.</p>
    <form method="post" class="auth-form">
      <label>Код подтверждения
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000">
      </label>
      <button class="primary-button" type="submit">Подтвердить email</button>
    </form>
    <form method="post" action="{{ url_for('resend_verification') }}" style="margin-top:12px;">
      <button class="secondary-button" type="submit">Отправить код ещё раз</button>
    </form>
    <p class="muted" style="margin-top:14px;">Код действует 15 минут. Проверьте также папку «Спам».</p>
  </div>
</section>
{% endblock %}
