{% extends "base.html" %}
{% block title %}Регистрация — LIVO{% endblock %}
{% block content %}
{% macro err(k) %}{% if errors.get(k) %}<span class="err">{{ errors[k] }}</span>{% endif %}{% endmacro %}
<div class="auth-wrap"><div class="auth-card">
  <h1>Создай аккаунт ✨</h1><p>Избранное, история просмотров и свой профиль.</p>
  <form class="form" method="post" data-busy novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Имя пользователя<input name="username" value="{{ form.get('username','') }}" autocomplete="username" minlength="3" maxlength="24" required class="{{ 'invalid' if errors.get('username') }}">{{ err('username') }}</label>
    <label>Email<input name="email" type="email" value="{{ form.get('email','') }}" autocomplete="email" required class="{{ 'invalid' if errors.get('email') }}">{{ err('email') }}</label>
    <label>Пароль<span class="pw-field"><input name="password" type="password" autocomplete="new-password" minlength="8" required class="{{ 'invalid' if errors.get('password') }}"><button type="button" class="pw-toggle" aria-label="Показать пароль">👁️</button></span><span class="hint">Минимум 8 символов</span>{{ err('password') }}</label>
    <label>Повтори пароль<input name="password2" type="password" autocomplete="new-password" required class="{{ 'invalid' if errors.get('password2') }}">{{ err('password2') }}</label>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="auth-alt">Уже есть аккаунт? <a href="{{ url_for('login', next=request.args.get('next')) }}">Войти</a></p>
</div></div>
{% endblock %}
